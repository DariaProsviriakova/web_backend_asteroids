<article class="asteroid-card" data-date-id="{{id}}" data-video-url="{{videoUrl}}">
  <a class="card-main" href="{{href}}" aria-label="Открыть ленту для {{designation}}">
    <img src="{{imageUrl}}" alt="{{designation}}" data-minio-url="{{imageUrl}}">
  </a>
  <div class="card-body">
    <a class="card-object" href="{{href}}">{{designation}}</a>
    <span class="card-date">{{approachDate}}</span>
    <strong>{{distance}}</strong>
    <a class="card-like" id="like-{{id}}" href="{{likeHref}}" aria-label="Поставить лайк {{designation}}">
      <span class="card-heart">♡</span>
      <span>{{likes}}</span>
    </a>
  </div>
</article>
