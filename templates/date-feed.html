<main class="feed-page" data-date-id="{{id}}" data-video-url="{{videoUrl}}">
  <video class="feed-media feed-video" poster="{{imageUrl}}" autoplay muted loop playsinline aria-label="Видео астероида">
    <source src="{{videoUrl}}" type="video/mp4">
  </video>
  <div class="feed-shade"></div>

  <section class="feed-content">
    <p class="feed-designation">{{designation}}</p>
    <h1>{{title}}</h1>
    <details class="feed-description">
      <summary>{{description}}</summary>
      <p>Дата расчета: {{approachDate}}. Минимальное расстояние: {{distance}}; прямое восхождение: {{rightAscension}}. Склонение: {{declination}}. Скорость: {{velocity}}. H: {{magnitude}}.</p>
    </details>
  </section>

  <div class="feed-actions">
    <a class="like-stack" id="like-{{id}}" href="{{likeHref}}" aria-label="Поставить лайк">
      <span class="heart-icon">♡</span>
      <span class="like-count">{{likes}}</span>
    </a>
    <a class="next-button" href="{{nextUrl}}">
      <span>Следующий</span>
      <span class="arrow-icon">→</span>
    </a>
  </div>
</main>
