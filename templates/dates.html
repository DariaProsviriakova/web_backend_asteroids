<main class="dates-page">
  <header class="dates-header">
    <h1>ВЫБОР ДАТЫ</h1>
  </header>

  <form class="filter-form" action="/dates" method="get">
    <label>
      <span>Фильтр по дате</span>
      <input name="approachDate" type="text" value="{{searchDate}}" placeholder="Например: 12 мая 2026">
    </label>
  </form>

  <section class="dates-grid" aria-label="Список дат">
    {{dateCards}}
  </section>
</main>
