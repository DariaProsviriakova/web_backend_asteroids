services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: asteroids
      POSTGRES_PASSWORD: asteroids
      POSTGRES_DB: asteroids_lab2
    ports:
      - "5455:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    depends_on:
      - postgres
    ports:
      - "8081:8080"

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-setup:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    volumes:
      - ./minio-assets/asteroids-lab:/assets:ro
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/asteroids-lab;
      mc anonymous set download local/asteroids-lab;
      mc cp --recursive /assets/ local/asteroids-lab;"

volumes:
  minio-data:
  postgres-data:
